<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaun Bartlett | Beta Testing</title>
    <meta name="description" content="Shaun Bartlett's beta testing site for games ready to play and test.">

    <style>
        :root {
            --bg: #f4efe5;
            --panel: #fffaf1;
            --ink: #2b2316;
            --muted: #746b5d;
            --rule: #d8cdbb;
            --accent: #4f6f4a;
            --accent-dark: #3f5a3b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }

        main {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 56px 0 72px;
        }

        header {
            margin-bottom: 34px;
            padding-bottom: 26px;
            border-bottom: 1px solid var(--rule);
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 6vw, 3.6rem);
            line-height: 1;
            letter-spacing: -0.03em;
        }

        .intro {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .games {
            display: grid;
            gap: 22px;
        }

        .game {
            display: grid;
            grid-template-columns: minmax(240px, 42%) 1fr;
            background: var(--panel);
            border: 1px solid var(--rule);
            border-radius: 14px;
            overflow: hidden;
        }

        .game-image {
            min-height: 220px;
            background: #e7dfcf;
            border-right: 1px solid var(--rule);
        }

        .game-image img {
            width: 100%;
            height: 100%;
            min-height: 220px;
            display: block;
            object-fit: cover;
        }

        .game-content {
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .game h2 {
            margin: 0 0 6px;
            font-size: 1.65rem;
        }

        .meta {
            margin: 0 0 20px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .button {
            display: inline-block;
            padding: 11px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            border: 1px solid var(--accent);
            background: var(--accent);
            color: white;
        }

        .button:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
        }

        footer {
            margin-top: 40px;
            padding-top: 22px;
            border-top: 1px solid var(--rule);
            color: var(--muted);
            font-size: 0.95rem;
        }

        footer p { margin: 0 0 6px; }

        footer a {
            color: var(--ink);
            font-weight: 700;
        }

        @media (max-width: 680px) {
            main { padding-top: 36px; }

            .game {
                grid-template-columns: 1fr;
            }

            .game-image {
                min-height: 180px;
                aspect-ratio: 16 / 9;
                border-right: 0;
                border-bottom: 1px solid var(--rule);
            }

            .game-image img {
                min-height: 0;
            }

            .game-content {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>Shaun Bartlett's Beta Testing Site</h1>
            <p class="intro">Games that are ready for beta testing. Click a game to play.</p>
        </header>

        <section class="games" aria-label="Games ready for beta testing">
            <article class="game">
                <div class="game-image">
                    <img src="assets/images/inheritance-thumb.jpg" alt="Inheritance game preview">
                </div>
                <div class="game-content">
                    <h2>Inheritance</h2>
                    <p class="meta">2 players · Browser game</p>
                    <a class="button" href="Inheritance.html">Play Inheritance</a>
                </div>
            </article>

            <!-- Add future beta-test game cards here, one at a time. -->
        </section>

        <footer>
            <p>Beta builds may change as testing continues.</p>
            <p>Contact: <a href="mailto:shaun.aj.bartlett@gmail.com">shaun.aj.bartlett@gmail.com</a></p>
        </footer>
    </main>
</body>
</html>
