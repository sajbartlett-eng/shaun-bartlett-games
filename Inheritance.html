<html lang="en">

<style>

:root {
    --paper:        #f3ead9;
    --paper-deep:   #e8dbc0;
    --paper-edge:   #cdbb96;
    --ink:          #2b2316;
    --ink-soft:     #5a4a30;
    --ink-faint:    #6b5d44;
    --grass:        #87975f;
    --land-2:       #739251;
    --land-3:       #618846;
    --land-4:       #527d3b;
    --manor:        #4a6b2c;
    --p1:           #2e5a8c;
    --p2:           #7a3a6a;
    --plot-a:        #3f6f6a;
    --plot-b:        #8d6540;
    --gold:         #825616;
    --gold-soft:    rgba(130, 86, 22, 0.14);
    --danger:       #a83a2c;
    --shadow:       0 1px 0 rgba(43, 35, 22, 0.08), 0 7px 18px rgba(43, 35, 22, 0.10);

    --display: 'Fraunces', Georgia, serif;
    --hand:    'Caveat', 'Marker Felt', cursive;
    --mono:    'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --body:    'Fraunces', Georgia, serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }

body {
    font-family: var(--body);
    color: var(--ink);
    background: var(--paper);
    background-image:
        radial-gradient(ellipse at 20% 10%, rgba(184, 133, 44, 0.06), transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(43, 35, 22, 0.05), transparent 50%),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.17  0 0 0 0 0.14  0 0 0 0 0.09  0 0 0 0.04 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x: hidden;
}

body.modal-open { overflow: hidden; }

.app {
    max-width: 720px;
    margin: 0 auto;
    padding: 18px clamp(12px, 3vw, 24px) 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

header.brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--paper-edge);
}
.brand h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(28px, 4.5vw, 40px);
    letter-spacing: -0.02em;
    line-height: 1;
}
.brand .sub {
    font-family: var(--hand);
    font-size: clamp(16px, 2.4vw, 20px);
    color: var(--ink-soft);
    letter-spacing: 0.02em;
}
.brand .icons { display: flex; gap: 8px; }
.icon-btn {
    width: 44px; height: 44px;
    border-radius: 3px;
    border: 1.5px solid var(--ink);
    background: rgba(243, 234, 217, 0.72);
    color: var(--ink);
    font-size: 14px;
    cursor: pointer;
